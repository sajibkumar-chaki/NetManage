name: NetManage Tests

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Backend tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Save backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-test-results
          path: test-results.xml

  windows-desktop:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install desktop test dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Backend and Qt integration tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Save desktop test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results.xml

  package:
    name: Package tested source
    needs: [test, windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source archive
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: NetManage-source-${{ github.sha }}
          path: dist/NetManage-source.zip
